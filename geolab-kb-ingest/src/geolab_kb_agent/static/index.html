<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR Agent</title>
<!-- Marked for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- DOMPurify for sanitizing rendered HTML -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<!-- KaTeX for LaTeX math -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- Chart.js for inline chart rendering -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
  Chart.defaults.color = '#94a3b8';
  Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.15)';
</script>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --user-bg: #1d4ed8;
    --agent-bg: #1e293b;
    --success: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Mode toggle */
  .mode-toggle {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }
  .mode-btn {
    padding: 5px 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: white;
  }
  .mode-btn:hover:not(.active) {
    color: var(--text);
  }

  /* Chat area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  .welcome h2 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  .welcome p {
    color: var(--text-muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .starters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .starter-btn {
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .starter-btn:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }

  /* Messages */
  .message {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 12px;
  }
  .message.user { justify-content: flex-end; }
  .message.agent { justify-content: flex-start; }

  .message-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.6;
    font-size: 14px;
  }
  .message.user .message-bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
  }
  .message.agent .message-bubble {
    background: var(--agent-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  /* Markdown content styles */
  .message-bubble h1, .message-bubble h2, .message-bubble h3, .message-bubble h4 {
    margin-top: 12px;
    margin-bottom: 6px;
  }
  .message-bubble h3 { font-size: 15px; }
  .message-bubble h4 { font-size: 14px; }
  .message-bubble p { margin-bottom: 8px; }
  .message-bubble ul, .message-bubble ol {
    margin-left: 20px;
    margin-bottom: 8px;
  }
  .message-bubble table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    width: 100%;
  }
  .message-bubble th, .message-bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .message-bubble th {
    background: var(--surface2);
    font-weight: 600;
  }
  .message-bubble code {
    background: var(--surface2);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .message-bubble pre {
    background: var(--bg);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .message-bubble pre code {
    background: none;
    padding: 0;
  }
  .message-bubble strong { color: #93c5fd; }

  /* Sources panel */
  .sources-panel {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .sources-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
    font-family: inherit;
  }
  .sources-toggle:hover { color: var(--text); }
  .sources-toggle .arrow {
    display: inline-block;
    transition: transform 0.2s;
    font-size: 10px;
  }
  .sources-toggle.open .arrow { transform: rotate(90deg); }
  .sources-list {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .sources-list.open { display: flex; }
  .source-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
  }
  .source-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .source-doc-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
    width: 100%;
    text-align: left;
    font-family: inherit;
    flex-wrap: wrap;
  }
  .source-doc-toggle:hover { color: var(--accent); }
  .source-doc-arrow {
    font-size: 9px;
    transition: transform 0.2s ease;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .source-item.expanded .source-doc-arrow {
    transform: rotate(90deg);
  }
  .source-chunk-count {
    font-size: 10px;
    color: var(--text-secondary);
    margin-left: auto;
  }
  .source-refs-body {
    display: none;
  }
  .source-item.expanded .source-refs-body {
    display: block;
  }
  .source-num {
    background: var(--accent);
    color: white;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .source-doc {
    color: var(--text);
    font-weight: 500;
    font-size: 12px;
  }
  .source-section {
    color: var(--text-muted);
    font-size: 11px;
  }
  .source-score {
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 500;
    margin-left: auto;
  }
  .score-high { background: #166534; color: #86efac; }
  .score-mid { background: #854d0e; color: #fde68a; }
  .score-low { background: #991b1b; color: #fca5a5; }
  .source-ref {
    margin-left: 16px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .source-ref-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 0;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .source-ref-toggle:hover { color: var(--accent); }
  .source-ref-arrow {
    font-size: 8px;
    transition: transform 0.2s ease;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .source-ref.expanded .source-ref-arrow {
    transform: rotate(90deg);
  }
  .source-ref .source-text {
    display: none;
  }
  .source-ref.expanded .source-text {
    display: block;
  }
  .source-text {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
    margin-top: 4px;
  }
  /* Scoring summary panel */
  .scoring-panel {
    border-top: 1px solid var(--border);
    margin-top: 8px;
    padding-top: 4px;
  }
  .scoring-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .scoring-toggle:hover { color: var(--text-primary); }
  .scoring-toggle .arrow {
    display: inline-block;
    transition: transform 0.2s ease;
    font-size: 10px;
  }
  .scoring-panel.open .scoring-toggle .arrow {
    transform: rotate(90deg);
  }
  .scoring-body {
    display: none;
    flex-direction: column;
    gap: 0;
    padding: 4px 0 8px;
  }
  .scoring-panel.open .scoring-body {
    display: flex;
  }
  .scoring-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .scoring-row:last-child { border-bottom: none; }
  .scoring-label {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-secondary);
    font-size: 12px;
  }
  .scoring-value {
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .scoring-info {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid var(--text-secondary);
    font-size: 9px;
    font-style: italic;
    color: var(--text-secondary);
    cursor: help;
    position: relative;
    flex-shrink: 0;
  }
  .scoring-info .scoring-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    font-style: normal;
    color: var(--text-secondary);
    line-height: 1.4;
    z-index: 100;
    pointer-events: none;
    white-space: normal;
  }
  .scoring-info:hover .scoring-tip {
    display: block;
  }
  .scoring-section {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    padding: 8px 0 2px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
  }

  /* Confidence badge */
  .confidence-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    margin-bottom: 8px;
    cursor: default;
  }
  .confidence-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .confidence-high {
    background: #052e16;
    color: #86efac;
  }
  .confidence-high .dot { background: #22c55e; }
  .confidence-medium, .confidence-low {
    background: #451a03;
    color: #fde68a;
  }
  .confidence-medium .dot, .confidence-low .dot { background: #f59e0b; }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }

  /* Input area */
  .input-area {
    padding: 10px 20px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-controls {
    max-width: 800px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .input-wrapper {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrapper textarea {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 150px;
    line-height: 1.5;
  }
  .input-wrapper textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .input-wrapper textarea::placeholder {
    color: var(--text-muted);
  }
  .send-btn {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Footer row: meta info + utility links */
  .input-footer {
    max-width: 800px;
    margin: 0 auto;
    padding-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .meta-info {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Report button */
  .report-btn {
    padding: 6px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .report-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .report-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Feedback controls */
  .feedback-controls {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    justify-content: flex-end;
  }
  .feedback-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 14px;
    width: 32px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    padding: 0;
  }
  .feedback-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--text);
  }
  .feedback-btn.selected {
    border-color: var(--accent);
    background: var(--accent);
    color: white;
  }
  .validated-badge {
    display: inline-block;
    background: rgba(34, 197, 94, 0.15);
    color: #22c55e;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
  }
  /* Utility text links (New Chat, Reset) */
  .util-links {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .util-link {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    transition: color 0.15s;
  }
  .util-link:hover { color: var(--text); }
  .util-sep { color: var(--border); font-size: 11px; }
  .feedback-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* KaTeX overrides */
  .katex { font-size: 1em; }
  .katex-display { margin: 10px 0; overflow-x: auto; }

  /* Chart.js inline charts */
  .chart-container {
    max-width: 640px;
    margin: 16px auto;
    padding: 16px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .chart-container canvas {
    width: 100% !important;
    max-height: 400px;
  }

  /* ═══════════════════════════════════════════════════════════
     SIDEBAR — Layout wrappers
     ═══════════════════════════════════════════════════════════ */
  .app-body {
    display: flex;
    flex-direction: row;
    flex: 1;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }
  .main-col {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    transform-origin: top left;
    overflow: hidden;
  }

  /* Resize handle between sidebar and main-col */
  .resize-handle {
    width: 5px;
    cursor: col-resize;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.15s, width 0.15s;
  }
  .resize-handle:hover,
  .resize-handle.active {
    width: 7px;
    background: var(--accent);
  }
  .sidebar.collapsed ~ .resize-handle {
    display: none;
  }

  /* Sidebar shell */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #0b1120;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s ease, border 0.25s ease;
  }
  .sidebar.collapsed {
    width: 0;
    border-right: none;
  }
  .sidebar-reopen {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 6px 6px 0;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 8px 4px;
    display: none;
    transition: background 0.15s;
  }
  .sidebar-reopen:hover {
    background: var(--surface2);
    color: var(--text);
  }
  .sidebar.collapsed ~ .sidebar-reopen {
    display: block;
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .sidebar-toggle {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .sidebar-toggle:hover {
    background: var(--surface2);
    color: var(--text);
  }
  .sidebar-tree {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .sidebar-loading {
    color: var(--text-muted);
    font-size: 12px;
    padding: 16px 8px;
    text-align: center;
  }

  /* ═══════════════════════════════════════════════════════════
     SIDEBAR — Tree nodes
     ═══════════════════════════════════════════════════════════ */
  .tree-node {
    margin-bottom: 2px;
  }
  .tree-node-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    font-size: 12px;
    color: var(--text-muted);
  }
  .tree-node-header:hover {
    background: rgba(255,255,255,0.04);
  }
  .tree-node-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--node-color, var(--text-muted));
    background: transparent;
    flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  }
  .tree-node-icon {
    font-size: 13px;
    flex-shrink: 0;
  }
  .tree-node-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .tree-node-count {
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.6;
    flex-shrink: 0;
  }
  .tree-node-status {
    font-size: 10px;
    flex-shrink: 0;
    margin-left: auto;
    color: var(--node-color, var(--text-muted));
    white-space: nowrap;
  }
  /* Root node (depth 0) */
  .tree-node[data-depth="0"] > .tree-node-header .tree-node-indicator {
    width: 10px;
    height: 10px;
  }
  .tree-node[data-depth="0"] > .tree-node-header .tree-node-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .tree-children {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
    padding-left: 14px;
  }
  .tree-node.expanded > .tree-children {
    max-height: 5000px;
  }

  /* Virtual group nodes (Disciplines / Projects) */
  .tree-group > .tree-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: background 0.15s;
  }
  .tree-group > .tree-group-header:hover {
    background: rgba(255,255,255,0.04);
  }
  .tree-group-chevron {
    font-size: 9px;
    transition: transform 0.2s;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .tree-group.expanded > .tree-group-header .tree-group-chevron {
    transform: rotate(90deg);
  }
  .tree-group-count {
    font-size: 10px;
    opacity: 0.5;
    margin-left: auto;
  }
  .tree-group > .tree-children {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
    padding-left: 6px;
  }
  .tree-group.expanded > .tree-children {
    max-height: 5000px;
  }

  /* ═══════════════════════════════════════════════════════════
     SIDEBAR — Node states
     ═══════════════════════════════════════════════════════════ */
  /* idle (default) — no extra styling */

  /* routing — pulse animation */
  .tree-node.state-routing > .tree-node-header {
    animation: sidebar-glow-pulse 1.5s infinite;
  }
  .tree-node.state-routing > .tree-node-header .tree-node-indicator {
    border-color: var(--node-color);
    background: var(--node-color);
    box-shadow: 0 0 6px var(--node-color);
  }
  .tree-node.state-routing > .tree-node-header .tree-node-label {
    color: var(--text);
  }

  /* activated — fill indicator solid */
  .tree-node.state-activated > .tree-node-header {
    background: rgba(255,255,255,0.05);
  }
  .tree-node.state-activated > .tree-node-header .tree-node-indicator {
    border-color: var(--node-color);
    background: var(--node-color);
  }
  .tree-node.state-activated > .tree-node-header .tree-node-label {
    color: var(--text);
  }

  /* retrieving — solid indicator fill */
  .tree-node.state-retrieving > .tree-node-header .tree-node-indicator {
    border-color: var(--node-color);
    background: var(--node-color);
  }
  .tree-node.state-retrieving > .tree-node-header .tree-node-label {
    color: var(--text);
  }
  .tree-node.state-retrieving > .tree-node-header {
    background: rgba(255,255,255,0.05);
  }

  /* complete — filled indicator + checkmark */
  .tree-node.state-complete > .tree-node-header .tree-node-indicator {
    border-color: var(--node-color);
    background: var(--node-color);
  }
  .tree-node.state-complete > .tree-node-header .tree-node-label {
    color: var(--text);
  }

  /* synthesizing — pulse in node color */
  .tree-node.state-synthesizing > .tree-node-header {
    animation: sidebar-glow-pulse 1.5s infinite;
  }
  .tree-node.state-synthesizing > .tree-node-header .tree-node-indicator {
    border-color: var(--node-color);
    background: var(--node-color);
    box-shadow: 0 0 6px var(--node-color);
  }
  .tree-node.state-synthesizing > .tree-node-header .tree-node-label {
    color: var(--text);
  }

  /* ═══════════════════════════════════════════════════════════
     SIDEBAR — Routing text block
     ═══════════════════════════════════════════════════════════ */
  .routing-text {
    display: none;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 10px;
    color: var(--text-muted);
    padding: 4px 8px;
    margin: 2px 0 4px 20px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
    border-left: 2px solid var(--success);
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .routing-text.visible {
    display: block;
    animation: sidebar-fade-slide-in 0.25s ease;
  }

  /* ═══════════════════════════════════════════════════════════
     SIDEBAR — Chunk cards
     ═══════════════════════════════════════════════════════════ */
  .sidebar-chunks-toggle {
    display: none;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 9px;
    cursor: pointer;
    padding: 2px 4px 2px 20px;
    font-family: inherit;
  }
  .sidebar-chunks-toggle:hover { color: var(--accent); }
  .sidebar-chunks-toggle .arrow {
    font-size: 7px;
    transition: transform 0.2s ease;
  }
  .sidebar-chunks-toggle.has-chunks {
    display: flex;
  }
  .sidebar-chunks-container {
    padding-left: 20px;
    display: none;
  }
  .sidebar-chunks-container.open {
    display: block;
  }
  .sidebar-chunks-toggle.open .arrow {
    transform: rotate(90deg);
  }
  .sidebar-chunk {
    background: rgba(255,255,255,0.03);
    border-left: 3px solid var(--node-color, var(--accent));
    border-radius: 0 4px 4px 0;
    padding: 5px 8px;
    margin: 3px 0;
    cursor: pointer;
    transition: background 0.15s;
    animation: sidebar-fade-slide-in 0.3s ease;
  }
  .sidebar-chunk:hover {
    background: rgba(255,255,255,0.06);
  }
  .sidebar-chunk-header {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
  }
  .sidebar-chunk-source {
    color: #d4879c;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100px;
  }
  .sidebar-chunk-score {
    padding: 0 5px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .sidebar-chunk-score.score-green {
    background: #052e16;
    color: #40c057;
  }
  .sidebar-chunk-score.score-yellow {
    background: #451a03;
    color: #f0c040;
  }
  .sidebar-chunk-score.score-orange {
    background: #431407;
    color: #e8a838;
  }
  .sidebar-chunk-preview {
    font-size: 10px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .sidebar-chunk-full {
    display: none;
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.4;
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .sidebar-chunk.expanded .sidebar-chunk-preview {
    display: none;
  }
  .sidebar-chunk.expanded .sidebar-chunk-full {
    display: block;
  }

  /* ═══════════════════════════════════════════════════════════
     SIDEBAR — Animations
     ═══════════════════════════════════════════════════════════ */
  @keyframes sidebar-glow-pulse {
    0%, 100% { box-shadow: none; }
    50% { box-shadow: inset 0 0 12px rgba(255,255,255,0.06); }
  }
  @keyframes sidebar-fade-slide-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes sidebar-dot-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .dot-pulse::after {
    content: '...';
    animation: sidebar-dot-pulse 1.2s infinite;
  }

  /* Print styles */
  @media print {
    .header, .input-area, .mode-toggle, .typing,
    .confidence-badge, .report-btn, .feedback-controls, .sidebar { display: none !important; }
    body {
      background: white;
      color: black;
      font-size: 12pt;
    }
    .chat-container {
      padding: 0;
      overflow: visible;
    }
    .message { max-width: 100%; }
    .message-bubble {
      background: white !important;
      border: none !important;
      color: black !important;
      padding: 8px 0;
    }
    .message.user .message-bubble {
      background: #f0f0f0 !important;
      padding: 8px 12px;
      border-radius: 4px;
    }
    .message-bubble strong { color: black; }
    .message-bubble code { background: #eee; }
    .message-bubble pre { background: #f5f5f5; border: 1px solid #ddd; }
    .sources-panel { border-top-color: #ccc; }
    .sources-list { display: flex !important; }
    .source-item {
      background: #fafafa;
      border-color: #ddd;
    }
    .source-score { background: #eee !important; color: #333 !important; }
    .source-doc, .source-section, .source-text { color: #333; }
    .source-refs-body { display: block !important; }
    .source-ref .source-text { display: block !important; }
    .source-ref-arrow, .source-doc-arrow { display: none; }
    .scoring-body { display: flex !important; }
    .scoring-info { display: none; }
    .scoring-panel { border-top-color: #ccc; }
    .scoring-value { color: #333; }
  }
</style>
</head>
<body>


<div class="app-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Routing Agent</span>
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">&#9776;</button>
    </div>
    <div class="sidebar-tree" id="sidebarTree">
      <div class="sidebar-loading">Loading topology...</div>
    </div>
  </aside>
  <div class="resize-handle" id="resizeHandle"></div>
  <button class="sidebar-reopen" id="sidebarReopen" title="Show routing panel">&#9654;</button>
  <div class="main-col">

<div class="chat-container" id="chat">
</div>

<div class="input-area">
  <div class="input-controls">
    <div class="mode-toggle">
      <button class="mode-btn" data-mode="concise">Concise</button>
      <button class="mode-btn active" data-mode="educational">Educational</button>
    </div>
    <button class="report-btn" id="reportBtn" title="Export last response as PDF report">Report</button>
  </div>
  <div class="input-wrapper">
    <textarea id="input" rows="1" placeholder="Ask a question..." autofocus></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
  </div>
  <div class="input-footer">
    <div class="meta-info" id="meta"></div>
    <div class="util-links">
      <button class="util-link" onclick="startNewChat()" title="Start a new conversation">New Chat</button>
      <span class="util-sep">|</span>
      <button class="util-link" onclick="resetValidations()" title="Clear all validated citations for demo reset">Reset Validations</button>
    </div>
  </div>
</div>

  </div><!-- /.main-col -->
</div><!-- /.app-body -->

<script>
const STREAM_API = '/api/v1/chat/stream';
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const metaEl = document.getElementById('meta');
const welcomeEl = document.getElementById('welcome');

let currentMode = 'educational';
let conversationId = null;
let isLoading = false;
let agentMessageIndex = 0;

// ═══════════════════════════════════════════════════════════════
// SIDEBAR — State & constants
// ═══════════════════════════════════════════════════════════════
let topologyTree = null;
let nodeStates = {};
let activeChunks = {};
let routingText = '';
let activatedNodes = new Set();

// Cascade colors by depth — all nodes are agents
// Depth 0: router (red) → Depth 1: disciplines/projects → Depth 2: packages (green)
// (Colors assigned in buildTreeNode via CASCADE_COLORS)

const sidebarEl = document.getElementById('sidebar');
const sidebarTreeEl = document.getElementById('sidebarTree');
const sidebarToggleBtn = document.getElementById('sidebarToggle');

// Toggle sidebar
const sidebarReopenBtn = document.getElementById('sidebarReopen');
sidebarToggleBtn.addEventListener('click', () => {
  sidebarEl.classList.toggle('collapsed');
});
sidebarReopenBtn.addEventListener('click', () => {
  sidebarEl.classList.remove('collapsed');
});

// ── Resize handle drag ─────────────────────────────────────
const resizeHandle = document.getElementById('resizeHandle');
let isResizing = false;
resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  resizeHandle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const newWidth = Math.min(500, Math.max(180, e.clientX));
  sidebarEl.style.width = newWidth + 'px';
});
document.addEventListener('mouseup', () => {
  if (!isResizing) return;
  isResizing = false;
  resizeHandle.classList.remove('active');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// ── Independent zoom on right panel ────────────────────────
const mainCol = document.querySelector('.main-col');
let zoomLevel = 1.0;
function applyZoom() {
  mainCol.style.transform = `scale(${zoomLevel})`;
  mainCol.style.width = `${100 / zoomLevel}%`;
  mainCol.style.height = `${100 / zoomLevel}%`;
}
mainCol.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  zoomLevel = Math.round(Math.min(2.0, Math.max(0.5, zoomLevel + delta)) * 10) / 10;
  applyZoom();
}, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === '0' && mainCol.matches(':hover')) {
    e.preventDefault();
    zoomLevel = 1.0;
    applyZoom();
  }
});
resizeHandle.addEventListener('dblclick', () => {
  zoomLevel = 1.0;
  applyZoom();
});

// ── Topology fetch ──────────────────────────────────────────
async function loadTopology() {
  try {
    const res = await fetch('/api/v1/kb/topology');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    topologyTree = data.tree;
    renderTree();
  } catch (e) {
    console.warn('Topology load failed:', e);
    sidebarTreeEl.innerHTML = '<div class="sidebar-loading">Topology unavailable</div>';
  }
}

// ── Tree rendering ──────────────────────────────────────────
function buildGroupNode(label, childNodes, depth) {
  const el = document.createElement('div');
  el.className = 'tree-group';

  const header = document.createElement('div');
  header.className = 'tree-group-header';

  const chevron = document.createElement('span');
  chevron.className = 'tree-group-chevron';
  chevron.textContent = '\u25B6';
  header.appendChild(chevron);

  const labelEl = document.createElement('span');
  labelEl.textContent = label;
  header.appendChild(labelEl);

  const count = document.createElement('span');
  count.className = 'tree-group-count';
  count.textContent = childNodes.length;
  header.appendChild(count);

  el.appendChild(header);

  const childrenWrap = document.createElement('div');
  childrenWrap.className = 'tree-children';
  for (const child of childNodes) {
    childrenWrap.appendChild(buildTreeNode(child, depth));
  }
  el.appendChild(childrenWrap);

  header.addEventListener('click', () => {
    el.classList.toggle('expanded');
  });

  return el;
}

function renderTree() {
  if (!topologyTree) return;
  sidebarTreeEl.innerHTML = '';

  // Build the router root node but intercept its children to split into groups
  const children = topologyTree.children || [];
  const disciplines = children.filter(c => !c.project_slug && !(c.id && c.id.startsWith('project:')));
  const projects = children.filter(c => c.project_slug || (c.id && c.id.startsWith('project:')));

  // Build root without children first, then append groups
  const rootCopy = { ...topologyTree, children: [] };
  const rootEl = buildTreeNode(rootCopy, 0);

  // Create a children wrapper for the groups
  const groupsWrap = document.createElement('div');
  groupsWrap.className = 'tree-children';

  if (disciplines.length > 0) {
    groupsWrap.appendChild(buildGroupNode('Disciplines', disciplines, 1));
  }
  if (projects.length > 0) {
    groupsWrap.appendChild(buildGroupNode('Projects', projects, 1));
  }

  rootEl.appendChild(groupsWrap);
  sidebarTreeEl.appendChild(rootEl);
}

function buildTreeNode(node, depth) {
  const el = document.createElement('div');
  el.className = 'tree-node';
  el.dataset.nodeId = node.id;
  el.dataset.depth = depth;

  // Determine color by cascade rank
  // Depth 0: router (red) → Depth 1: disciplines (purple), projects (blue) → Depth 2: packages (green)
  const CASCADE_COLORS = ['#e03131', '#9775fa', '#22c55e'];
  let nodeColor;
  if (node.project_slug || (node.id && node.id.startsWith('project:'))) {
    nodeColor = '#4a9eff'; // projects always blue
  } else {
    nodeColor = CASCADE_COLORS[Math.min(depth, CASCADE_COLORS.length - 1)];
  }
  el.style.setProperty('--node-color', nodeColor);

  // Header
  const header = document.createElement('div');
  header.className = 'tree-node-header';

  const indicator = document.createElement('div');
  indicator.className = 'tree-node-indicator';
  header.appendChild(indicator);

  // Icon — every node is an agent, use 🤖 for all
  const iconEl = document.createElement('span');
  iconEl.className = 'tree-node-icon';
  iconEl.textContent = '\u{1F916}';
  header.appendChild(iconEl);

  const label = document.createElement('span');
  label.className = 'tree-node-label';
  label.textContent = node.label || node.id;
  header.appendChild(label);

  if (node.chunk_count) {
    const count = document.createElement('span');
    count.className = 'tree-node-count';
    count.textContent = node.chunk_count;
    header.appendChild(count);
  }

  const status = document.createElement('span');
  status.className = 'tree-node-status';
  header.appendChild(status);

  el.appendChild(header);

  // Routing text (only for router)
  if (node.id === 'router') {
    const rt = document.createElement('div');
    rt.className = 'routing-text';
    rt.id = 'routingTextBlock';
    el.appendChild(rt);
  }

  // Chunks toggle + container (collapsed by default)
  const chunksToggle = document.createElement('button');
  chunksToggle.className = 'sidebar-chunks-toggle';
  chunksToggle.innerHTML = '<span class="arrow">&#9654;</span> <span class="chunks-label">chunks</span>';
  el.appendChild(chunksToggle);

  const chunksContainer = document.createElement('div');
  chunksContainer.className = 'sidebar-chunks-container';
  el.appendChild(chunksContainer);

  chunksToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    chunksToggle.classList.toggle('open');
    chunksContainer.classList.toggle('open');
  });

  // Children
  if (node.children && node.children.length > 0) {
    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'tree-children';
    for (const child of node.children) {
      childrenWrap.appendChild(buildTreeNode(child, depth + 1));
    }
    el.appendChild(childrenWrap);
  }

  // Click to toggle expanded
  header.addEventListener('click', () => {
    el.classList.toggle('expanded');
  });

  // Root starts expanded
  if (depth === 0) {
    el.classList.add('expanded');
  }

  return el;
}

// ── Tree search helpers ─────────────────────────────────────
function findTreeNodeEl(nodeId) {
  return sidebarTreeEl.querySelector(`[data-node-id="${CSS.escape(nodeId)}"]`);
}

function findTreeData(nodeId, tree) {
  if (!tree) return null;
  if (tree.id === nodeId) return tree;
  if (tree.children) {
    for (const child of tree.children) {
      const found = findTreeData(nodeId, child);
      if (found) return found;
    }
  }
  return null;
}

function findParentData(nodeId, tree) {
  if (!tree || !tree.children) return null;
  for (const child of tree.children) {
    if (child.id === nodeId) return tree;
    const found = findParentData(nodeId, child);
    if (found) return found;
  }
  return null;
}

// ── State management ────────────────────────────────────────
function setNodeState(nodeId, state) {
  const el = findTreeNodeEl(nodeId);
  if (!el) return;

  // Remove old state classes
  el.classList.remove('state-idle', 'state-routing', 'state-activated',
    'state-retrieving', 'state-complete', 'state-synthesizing');
  el.classList.add('state-' + state);
  nodeStates[nodeId] = state;

  // Auto-expand parent and fill circles along the path
  if (state !== 'idle' && state !== 'complete') {
    // Expand any virtual group nodes (Disciplines/Projects) in the DOM ancestry
    let ancestor = el.parentElement;
    while (ancestor && !ancestor.isSameNode(sidebarTreeEl)) {
      if (ancestor.classList.contains('tree-group')) {
        ancestor.classList.add('expanded');
      }
      ancestor = ancestor.parentElement;
    }

    let currentId = nodeId;
    while (true) {
      const parentData = findParentData(currentId, topologyTree);
      if (!parentData) break;
      const parentEl = findTreeNodeEl(parentData.id);
      if (!parentEl) break;
      parentEl.classList.add('expanded');
      // Fill parent indicator if not already in an active state
      if (!nodeStates[parentData.id] || nodeStates[parentData.id] === 'idle') {
        parentEl.classList.add('state-activated');
        nodeStates[parentData.id] = 'activated';
      }
      currentId = parentData.id;
    }
  }

  // Update status text
  const statusEl = el.querySelector(':scope > .tree-node-header .tree-node-status');
  if (!statusEl) return;

  switch (state) {
    case 'routing':
      statusEl.innerHTML = '<span class="dot-pulse"></span>';
      break;
    case 'activated':
      statusEl.textContent = 'Searching\u2026';
      break;
    case 'retrieving':
      statusEl.textContent = 'Retrieving';
      break;
    case 'complete':
      statusEl.textContent = '\u2714';
      statusEl.style.color = 'var(--node-color)';
      break;
    case 'synthesizing':
      statusEl.textContent = 'Synthesizing\u2026';
      break;
    default:
      statusEl.textContent = '';
      statusEl.style.color = '';
  }
}

function setRoutingText(text) {
  routingText = text;
  const block = document.getElementById('routingTextBlock');
  if (!block) return;
  if (text) {
    block.textContent = text;
    block.classList.add('visible');
  } else {
    block.textContent = '';
    block.classList.remove('visible');
  }
}

function addSidebarChunk(nodeId, chunkData) {
  const nodeEl = findTreeNodeEl(nodeId);
  if (!nodeEl) return;

  const container = nodeEl.querySelector(':scope > .sidebar-chunks-container');
  if (!container) return;

  const card = document.createElement('div');
  card.className = 'sidebar-chunk';

  const header = document.createElement('div');
  header.className = 'sidebar-chunk-header';

  // Source badge
  const sourceBadge = document.createElement('span');
  sourceBadge.className = 'sidebar-chunk-source';
  sourceBadge.textContent = chunkData.chunk_type || chunkData.package_id || 'chunk';
  sourceBadge.title = chunkData.package_id || '';
  header.appendChild(sourceBadge);

  // Preview snippet
  const preview = document.createElement('span');
  preview.className = 'sidebar-chunk-preview';
  preview.textContent = chunkData.title || chunkData.snippet || '';
  header.appendChild(preview);

  card.appendChild(header);

  // Full text (expanded)
  const full = document.createElement('div');
  full.className = 'sidebar-chunk-full';
  full.textContent = chunkData.snippet || chunkData.title || '';
  card.appendChild(full);

  // Click to expand/collapse
  card.addEventListener('click', () => {
    card.classList.toggle('expanded');
  });

  container.appendChild(card);

  // Show the chunks toggle and update count
  const toggle = nodeEl.querySelector(':scope > .sidebar-chunks-toggle');
  if (toggle) {
    toggle.classList.add('has-chunks');
    const count = container.children.length;
    const label = toggle.querySelector('.chunks-label');
    if (label) label.textContent = `${count} chunk${count !== 1 ? 's' : ''}`;
  }

  // Expand the node to reveal the toggle
  nodeEl.classList.add('expanded');

  // Track chunks
  if (!activeChunks[nodeId]) activeChunks[nodeId] = [];
  activeChunks[nodeId].push(chunkData);
}

function resetSidebarState() {
  // Clear all state classes
  sidebarTreeEl.querySelectorAll('.tree-node').forEach(el => {
    el.classList.remove('state-idle', 'state-routing', 'state-activated',
      'state-retrieving', 'state-complete', 'state-synthesizing');
    // Clear status text
    const statusEl = el.querySelector(':scope > .tree-node-header .tree-node-status');
    if (statusEl) {
      statusEl.textContent = '';
      statusEl.style.color = '';
    }
    // Clear chunk containers and reset toggle
    const chunks = el.querySelector(':scope > .sidebar-chunks-container');
    if (chunks) { chunks.innerHTML = ''; chunks.classList.remove('open'); }
    const cToggle = el.querySelector(':scope > .sidebar-chunks-toggle');
    if (cToggle) { cToggle.classList.remove('has-chunks', 'open'); }
  });

  // Collapse all except root
  sidebarTreeEl.querySelectorAll('.tree-node').forEach(el => {
    if (el.dataset.depth === '0') {
      el.classList.add('expanded');
    } else {
      el.classList.remove('expanded');
    }
  });

  // Reset state
  nodeStates = {};
  activeChunks = {};
  activatedNodes = new Set();
  routingText = '';
  setRoutingText('');
}

// ── Map tool arguments to tree node IDs ─────────────────────
function resolveNodeIdFromToolCall(toolName, args) {
  if (toolName === 'search_kb') {
    if (args.source === 'project' && args.project) {
      const slug = args.project.toLowerCase().replace(/\s+/g, '-');
      return 'project:' + slug;
    }
    if (args.discipline) {
      return 'disc:' + args.discipline;
    }
  }
  if (toolName === 'lookup_equation' || toolName === 'lookup_table' || toolName === 'get_package_info') {
    // Try to derive discipline from equation_id, table_id, or package_id
    const id = args.equation_id || args.table_id || args.package_id || '';
    if (id) {
      // package_id format: "discipline.topic..." — first segment is the discipline
      const disc = id.split('.')[0];
      // Check if we have a tree node for it
      if (findTreeNodeEl('disc:' + disc)) {
        return 'disc:' + disc;
      }
    }
  }
  return null;
}

function resolveNodeIdFromChunk(chunk) {
  // 1. project package
  if (chunk.package_id && chunk.package_id.startsWith('project:')) {
    return chunk.package_id;
  }
  // 2. KB package — look for exact package node, or fall back to discipline
  if (chunk.package_id) {
    if (findTreeNodeEl(chunk.package_id)) {
      return chunk.package_id;
    }
  }
  if (chunk.discipline) {
    const discId = 'disc:' + chunk.discipline;
    if (findTreeNodeEl(discId)) return discId;
  }
  return 'router'; // fallback
}

function appendConfidence(bubble, confidence) {
  if (!confidence || !confidence.level) return;
  const labels = { high: 'Cited', medium: 'Verify Citations', low: 'Verify Citations' };
  const badge = document.createElement('div');
  badge.className = `confidence-badge confidence-${confidence.level}`;
  badge.title = confidence.reasoning || '';
  badge.innerHTML = `<span class="dot"></span>${labels[confidence.level] || confidence.level}`;
  // Insert at the top of the bubble, before rendered content
  bubble.insertBefore(badge, bubble.firstChild);
}

function appendSources(bubble, sources, responseText) {
  if (!sources || sources.length === 0) return;

  // Extract cited references from response text (e.g. [1], [1a], [2b])
  const citedSet = new Set();
  if (responseText) {
    const citePattern = /\[(\d+[a-z]?)\]/g;
    let m;
    while ((m = citePattern.exec(responseText)) !== null) {
      citedSet.add(m[1]);
    }
  }

  // Filter sources to only cited docs/chunks
  const filteredSources = [];
  sources.forEach(grp => {
    const docNum = grp.doc_number;
    const subRefs = grp.sub_refs || [];

    // Check if bare doc number is cited (e.g. [1]) or any sub-ref letter
    const citedRefs = subRefs.filter(ref => {
      const key = `${docNum}${ref.letter || ''}`;
      return citedSet.has(key) || citedSet.has(String(docNum));
    });

    if (citedRefs.length > 0) {
      filteredSources.push({ ...grp, sub_refs: citedRefs });
    }
  });

  // Fall back to all sources if no citations were detected
  const displaySources = filteredSources.length > 0 ? filteredSources : sources;

  // Count total sub-references across all document groups
  const totalRefs = displaySources.reduce((sum, grp) => sum + (grp.sub_refs ? grp.sub_refs.length : 1), 0);

  const panel = document.createElement('div');
  panel.className = 'sources-panel';

  // Toggle button
  const toggle = document.createElement('button');
  toggle.className = 'sources-toggle';
  toggle.innerHTML = `<span class="arrow">&#9654;</span> Sources (${displaySources.length} document${displaySources.length !== 1 ? 's' : ''}, ${totalRefs} cited)`;
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    list.classList.toggle('open');
  });
  panel.appendChild(toggle);

  // Source list (collapsed by default)
  const list = document.createElement('div');
  list.className = 'sources-list';

  displaySources.forEach((grp) => {
    const docNum = grp.doc_number;
    const docName = grp.document_name || 'Unknown';
    const citation = grp.display_citation || '';
    const project = grp.project;
    const subRefs = grp.sub_refs || [];

    // Document-level container
    const docItem = document.createElement('div');
    docItem.className = 'source-item';

    // Document header: clickable toggle to expand/collapse chunks
    const docHeader = document.createElement('button');
    docHeader.className = 'source-doc-toggle';

    const docArrow = document.createElement('span');
    docArrow.className = 'source-doc-arrow';
    docArrow.innerHTML = '&#9654;';
    docHeader.appendChild(docArrow);

    const numBadge = document.createElement('span');
    numBadge.className = 'source-num';
    numBadge.textContent = String(docNum);
    docHeader.appendChild(numBadge);

    const docEl = document.createElement('span');
    docEl.className = 'source-doc';
    docEl.textContent = citation || docName;
    // Show raw filename on hover for audit
    if (citation) {
      docEl.title = docName;
    }
    docHeader.appendChild(docEl);

    // Only show separate project line when no citation (fallback)
    if (!citation && project) {
      const projEl = document.createElement('span');
      projEl.className = 'source-section';
      projEl.textContent = `— ${project}`;
      docHeader.appendChild(projEl);
    }

    const chunkCount = document.createElement('span');
    chunkCount.className = 'source-chunk-count';
    chunkCount.textContent = `${subRefs.length} chunk${subRefs.length !== 1 ? 's' : ''}`;
    docHeader.appendChild(chunkCount);

    docHeader.addEventListener('click', () => {
      docItem.classList.toggle('expanded');
    });

    docItem.appendChild(docHeader);

    // Sub-references container (hidden until doc is expanded)
    const refsContainer = document.createElement('div');
    refsContainer.className = 'source-refs-body';

    subRefs.forEach((ref) => {
      const refDiv = document.createElement('div');
      refDiv.className = 'source-ref';

      const refHeader = document.createElement('button');
      refHeader.className = 'source-ref-toggle';

      const refArrow = document.createElement('span');
      refArrow.className = 'source-ref-arrow';
      refArrow.innerHTML = '&#9654;';
      refHeader.appendChild(refArrow);

      const refBadge = document.createElement('span');
      refBadge.className = 'source-num';
      refBadge.style.fontSize = '10px';
      refBadge.style.padding = '1px 5px';
      refBadge.textContent = `${docNum}${ref.letter}`;
      refHeader.appendChild(refBadge);

      // Section + page
      const sectionParts = [];
      if (ref.section) sectionParts.push(ref.section);
      if (ref.page_number != null) sectionParts.push(`p. ${ref.page_number}`);
      if (sectionParts.length) {
        const secEl = document.createElement('span');
        secEl.className = 'source-section';
        secEl.textContent = sectionParts.join(' — ');
        refHeader.appendChild(secEl);
      }

      refDiv.appendChild(refHeader);

      // Chunk text (collapsed by default)
      const fullText = ref.chunk_text || '';
      if (fullText) {
        const textEl = document.createElement('div');
        textEl.className = 'source-text';
        textEl.textContent = fullText;
        refDiv.appendChild(textEl);

        refHeader.addEventListener('click', () => {
          refDiv.classList.toggle('expanded');
        });
      }

      refsContainer.appendChild(refDiv);
    });

    docItem.appendChild(refsContainer);

    list.appendChild(docItem);
  });

  panel.appendChild(list);
  bubble.appendChild(panel);
}

function appendScoringPanel(bubble, sources, confidence, tokenUsage) {
  if (!sources || !confidence) return;

  // --- Token cost rates (per 1M tokens, enterprise scale) ---
  // Claude Sonnet 4.5: $3/M input, $15/M output
  // Claude Sonnet 4: $3/M input, $15/M output
  // Claude Haiku 3.5: $0.80/M input, $4/M output
  // Default to Sonnet 4 pricing if model unknown
  const PRICING = {
    'claude-sonnet-4-5-20250929': { input: 3.00, output: 15.00, label: 'Sonnet 4.5' },
    'claude-sonnet-4-20250514':   { input: 3.00, output: 15.00, label: 'Sonnet 4' },
    'claude-haiku-3-5-20241022':  { input: 0.80, output: 4.00,  label: 'Haiku 3.5' },
  };
  const DEFAULT_PRICING = { input: 3.00, output: 15.00, label: 'Claude' };

  // Collect all similarity scores from sub_refs
  const allScores = [];
  let totalChunks = 0;
  sources.forEach(grp => {
    (grp.sub_refs || []).forEach(ref => {
      if (ref.similarity_score != null) {
        allScores.push(parseFloat(ref.similarity_score));
      }
      totalChunks++;
    });
  });

  const meanScore = allScores.length
    ? (allScores.reduce((a, b) => a + b, 0) / allScores.length)
    : null;
  const scoreSpread = allScores.length
    ? (Math.max(...allScores) - Math.min(...allScores))
    : null;

  // Compute token totals from steps
  let totalInput = 0, totalOutput = 0, totalCacheCreate = 0, totalCacheRead = 0;
  const steps = (tokenUsage && tokenUsage.steps) || [];
  steps.forEach(s => {
    totalInput += s.input_tokens || 0;
    totalOutput += s.output_tokens || 0;
    totalCacheCreate += s.cache_creation_input_tokens || 0;
    totalCacheRead += s.cache_read_input_tokens || 0;
  });
  const totalTokens = totalInput + totalOutput;

  // Cost estimate
  const modelId = (tokenUsage && tokenUsage.model) || '';
  const pricing = PRICING[modelId] || DEFAULT_PRICING;
  const costUsd = (totalInput / 1e6) * pricing.input + (totalOutput / 1e6) * pricing.output;

  const metrics = [
    {
      label: 'Retrieval Confidence',
      value: confidence.level || 'N/A',
      tip: confidence.reasoning || 'Overall confidence in the retrieval quality.'
    },
    {
      label: 'Top Match Score',
      value: confidence.score != null ? parseFloat(confidence.score).toFixed(3) : 'N/A',
      tip: 'Similarity between your question and the best-matching content. Above 0.65 is typically relevant for technical queries.'
    },
    {
      label: 'Top-2 Gap',
      value: confidence.top_gap != null ? parseFloat(confidence.top_gap).toFixed(3) : 'N/A',
      tip: 'Difference between the #1 and #2 matches. A larger gap (>0.10) means one source clearly stood out as most relevant.'
    },
    {
      label: 'Mean Retrieval Score',
      value: meanScore != null ? meanScore.toFixed(3) : 'N/A',
      tip: 'Average similarity across all retrieved chunks. Higher means most results were relevant, not just the top one.'
    },
    {
      label: 'Score Spread',
      value: scoreSpread != null ? scoreSpread.toFixed(3) : 'N/A',
      tip: 'Range between highest and lowest scores. Small spread = uniformly relevant results; large spread = mixed quality.'
    },
    {
      label: 'Source Coverage',
      value: `${sources.length} doc${sources.length !== 1 ? 's' : ''} / ${totalChunks} chunk${totalChunks !== 1 ? 's' : ''}`,
      tip: 'Number of unique documents and chunks retrieved. More documents means the answer draws from broader evidence.'
    }
  ];

  // Token usage metrics
  if (totalTokens > 0) {
    metrics.push(
      { section: 'Token Consumption' },
      {
        label: 'Total Tokens',
        value: totalTokens.toLocaleString(),
        tip: `Input: ${totalInput.toLocaleString()} + Output: ${totalOutput.toLocaleString()}. Total tokens consumed across all agent steps for this request.`
      },
      {
        label: 'API Calls',
        value: `${steps.length} step${steps.length !== 1 ? 's' : ''}`,
        tip: steps.map(s =>
          `${s.step}: ${(s.input_tokens||0).toLocaleString()} in / ${(s.output_tokens||0).toLocaleString()} out`
        ).join('\n'),
      },
      {
        label: 'Cache Efficiency',
        value: totalCacheRead > 0
          ? `${Math.round(totalCacheRead / (totalInput + totalCacheRead) * 100)}% hit`
          : 'No cache',
        tip: `Cache created: ${totalCacheCreate.toLocaleString()} tokens. Cache read: ${totalCacheRead.toLocaleString()} tokens. Prompt caching reduces cost by reusing previously seen content.`
      },
      {
        label: 'Est. Cost',
        value: costUsd < 0.01 ? `<$0.01` : `$${costUsd.toFixed(3)}`,
        tip: `Based on ${pricing.label} enterprise pricing: $${pricing.input}/M input, $${pricing.output}/M output tokens. Actual cost may vary with caching discounts and batch usage.`
      }
    );
  }

  const panel = document.createElement('div');
  panel.className = 'scoring-panel';

  const toggle = document.createElement('button');
  toggle.className = 'scoring-toggle';
  toggle.innerHTML = '<span class="arrow">&#9654;</span> Retrieval Scoring Summary';
  toggle.addEventListener('click', () => {
    panel.classList.toggle('open');
  });
  panel.appendChild(toggle);

  const body = document.createElement('div');
  body.className = 'scoring-body';

  metrics.forEach(m => {
    // Section dividers
    if (m.section) {
      const divider = document.createElement('div');
      divider.className = 'scoring-section';
      divider.textContent = m.section;
      body.appendChild(divider);
      return;
    }

    const row = document.createElement('div');
    row.className = 'scoring-row';

    const label = document.createElement('span');
    label.className = 'scoring-label';
    label.textContent = m.label;

    const info = document.createElement('span');
    info.className = 'scoring-info';
    info.textContent = 'i';
    const tip = document.createElement('span');
    tip.className = 'scoring-tip';
    tip.textContent = m.tip;
    info.appendChild(tip);
    label.appendChild(info);

    const val = document.createElement('span');
    val.className = 'scoring-value';
    val.textContent = m.value;

    row.appendChild(label);
    row.appendChild(val);
    body.appendChild(row);
  });

  panel.appendChild(body);
  bubble.appendChild(panel);
}

function escapeHtml(str) {

function renderCharts(container) {
  const codeBlocks = container.querySelectorAll('pre code.language-chart');
  codeBlocks.forEach(codeEl => {
    const preEl = codeEl.parentElement;
    try {
      const config = JSON.parse(codeEl.textContent);
      const wrapper = document.createElement('div');
      wrapper.className = 'chart-container';
      const canvas = document.createElement('canvas');
      wrapper.appendChild(canvas);
      preEl.replaceWith(wrapper);
      new Chart(canvas, config);
    } catch (e) {
      // Malformed JSON — leave the code block as-is
      console.warn('Chart render failed:', e);
    }
  });
}

function renderContent(bubble, text) {
  bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
  renderMathInElement(bubble, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false },
    ],
    throwOnError: false,
  });
  renderCharts(bubble);
}

async function send() {
  const message = inputEl.value.trim();
  if (!message || isLoading) return;

  // Reset sidebar for new query
  resetSidebarState();

  // Hide welcome
  if (welcomeEl) welcomeEl.style.display = 'none';

  // Add user message
  addUserMessage(message);

  // Clear input
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Create agent bubble with typing indicator
  const { msgEl, bubble } = createAgentBubble();

  isLoading = true;
  sendBtn.disabled = true;
  metaEl.textContent = '';

  const startTime = Date.now();

  try {
    const res = await fetch(STREAM_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        mode: currentMode,
        conversation_id: conversationId,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let renderScheduled = false;

    let renderRAF = null;
    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      renderRAF = requestAnimationFrame(() => {
        renderContent(bubble, fullText);
        chatEl.scrollTop = chatEl.scrollHeight;
        renderScheduled = false;
        renderRAF = null;
      });
    }
    function cancelScheduledRender() {
      if (renderRAF) {
        cancelAnimationFrame(renderRAF);
        renderRAF = null;
        renderScheduled = false;
      }
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // Parse SSE lines
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line in buffer

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);
        if (!jsonStr) continue;

        let event;
        try {
          event = JSON.parse(jsonStr);
        } catch {
          continue;
        }

        if (event.conversation_id) {
          conversationId = event.conversation_id;
        }

        // ── Sidebar routing events ──────────────────
        if (event.type === 'routing_started') {
          setNodeState('router', 'routing');
          setRoutingText('Analyzing query...');
        }

        if (event.type === 'tool_call') {
          const tn = event.tool_name;
          const args = event.arguments || {};
          // Append to routing text
          const argsSummary = Object.entries(args)
            .filter(([k]) => k !== 'query' && k !== 'top_k')
            .map(([k, v]) => `${k}=${v}`)
            .join(', ');
          setRoutingText(routingText + '\n' + tn + (argsSummary ? ` (${argsSummary})` : ''));

          // Activate target nodes
          const targetId = resolveNodeIdFromToolCall(tn, args);
          if (targetId) {
            activatedNodes.add(targetId);
            setNodeState(targetId, 'activated');
          }
        }

        if (event.type === 'tool_result') {
          const chunks = event.chunks || [];
          for (const chunk of chunks) {
            const nodeId = resolveNodeIdFromChunk(chunk);
            if (nodeId) {
              setNodeState(nodeId, 'retrieving');
              activatedNodes.add(nodeId);
              addSidebarChunk(nodeId, chunk);
            }
          }
        }

        if (event.type === 'synthesis_started') {
          setNodeState('router', 'synthesizing');
        }
        // ── End sidebar routing events ──────────────

        if (event.text) {
          fullText += event.text;
          scheduleRender();
        }

        if (event.rewrite) {
          fullText = event.rewrite;
          scheduleRender();
        }

        if (event.error) {
          fullText += `\n\n**Error:** ${event.error}`;
          renderContent(bubble, fullText);
        }

        if (event.done) {
          // Mark all activated sidebar nodes complete
          for (const nid of activatedNodes) {
            setNodeState(nid, 'complete');
            // Only expand nodes that actually have retrieved chunks
            if (activeChunks[nid] && activeChunks[nid].length > 0) {
              const nodeEl = findTreeNodeEl(nid);
              if (nodeEl) nodeEl.classList.add('expanded');
            }
          }
          setNodeState('router', 'complete');

          // Cancel any pending rAF render so it doesn't wipe appended elements
          cancelScheduledRender();

          // Final render
          renderContent(bubble, fullText);
          appendConfidence(bubble, event.confidence);
          appendSources(bubble, event.sources, fullText);
          appendScoringPanel(bubble, event.sources, event.confidence, event.token_usage);

          // Store raw data for export
          bubble.dataset.raw = fullText;
          if (event.confidence) bubble.dataset.confidence = JSON.stringify(event.confidence);
          if (event.sources) bubble.dataset.sources = JSON.stringify(event.sources);

          // Store query text and chunk info for validation feature
          bubble.dataset.queryText = message;
          if (event.sources) {
            const chunkIds = [];
            const chunkScores = [];
            event.sources.forEach(grp => {
              (grp.sub_refs || []).forEach(ref => {
                chunkIds.push(ref.chunk_id);
                chunkScores.push(ref.similarity_score || 0);
              });
            });
            bubble.dataset.chunkIds = JSON.stringify(chunkIds);
            bubble.dataset.chunkScores = JSON.stringify(chunkScores);
          }

          // Add feedback buttons
          appendFeedback(bubble, agentMessageIndex);
          agentMessageIndex++;

          chatEl.scrollTop = chatEl.scrollHeight;

          // Show meta
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          const parts = [`${elapsed}s`];
          if (event.tool_calls_made) parts.push(`${event.tool_calls_made} tool calls`);
          if (event.sources?.length) {
            const refCount = event.sources.reduce((s, g) => s + (g.sub_refs ? g.sub_refs.length : 1), 0);
            parts.push(`${event.sources.length} docs / ${refCount} refs`);
          }
          metaEl.textContent = parts.join(' \u00b7 ');
        }
      }
    }

    // If stream ended without a done event, do a final render
    if (fullText && !bubble.querySelector('.sources-panel')) {
      renderContent(bubble, fullText);
    }

  } catch (err) {
    renderContent(bubble, `**Error:** ${err.message}`);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function createAgentBubble() {
  const msgEl = document.createElement('div');
  msgEl.className = 'message agent';
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgEl.appendChild(bubble);
  chatEl.appendChild(msgEl);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { msgEl, bubble };
}

function generateReport() {
  // Find the most recent agent bubble
  const bubbles = chatEl.querySelectorAll('.message.agent .message-bubble');
  if (bubbles.length === 0) return;
  const bubble = bubbles[bubbles.length - 1];
  const raw = bubble.dataset.raw || bubble.textContent;

  // Build ASCE-style references (only cited sources)
  let refsHtml = '';
  const srcs = bubble.dataset.sources;
  if (srcs) {
    try {
      const sources = JSON.parse(srcs);
      // Extract cited references from response text
      const citedSet = new Set();
      const citePattern = /\[(\d+[a-z]?)\]/g;
      let cm;
      while ((cm = citePattern.exec(raw)) !== null) {
        citedSet.add(cm[1]);
      }

      // Filter to only cited docs/chunks
      const citedSources = [];
      sources.forEach(grp => {
        const docNum = grp.doc_number;
        const subs = grp.sub_refs || [];
        const citedRefs = subs.filter(ref => {
          const key = `${docNum}${ref.letter || ''}`;
          return citedSet.has(key) || citedSet.has(String(docNum));
        });
        if (citedRefs.length > 0) {
          citedSources.push({ ...grp, sub_refs: citedRefs });
        }
      });
      const displaySources = citedSources.length > 0 ? citedSources : sources;

      if (displaySources.length) {
        refsHtml = '<h2>References</h2><div class="references">';
        displaySources.forEach((grp) => {
          const doc = grp.display_citation || grp.document_name || 'Unknown';
          const proj = grp.project || '';
          const subRefs = (grp.sub_refs || []).map(ref => {
            const parts = [];
            if (ref.section) parts.push(ref.section);
            if (ref.page_number != null) parts.push(`p. ${ref.page_number}`);
            return parts.join(', ');
          }).filter(Boolean);
          const detail = subRefs.length ? ` (${subRefs.join('; ')})` : '';
          const projStr = proj ? `, ${proj}` : '';
          refsHtml += `<p class="ref-entry">[${grp.doc_number}] ${doc}${projStr}${detail}.</p>`;
        });
        refsHtml += '</div>';
      }
    } catch {}
  }

  // Convert chart canvases to static <img> tags for the PDF
  let chartImagesHtml = '';
  const chartCanvases = bubble.querySelectorAll('.chart-container canvas');
  chartCanvases.forEach(canvas => {
    try {
      const imgSrc = canvas.toDataURL('image/png');
      chartImagesHtml += `<div style="text-align:center;margin:12pt 0;"><img src="${imgSrc}" style="max-width:100%;"></div>`;
    } catch (e) {
      console.warn('Chart export failed:', e);
    }
  });

  // Render markdown body to HTML
  const bodyHtml = DOMPurify.sanitize(marked.parse(raw));

  // Build the print document
  const printDoc = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>BR Agent Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  @page { size: letter; margin: 1in; }
  body { font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.6; color: #000; max-width: 6.5in; margin: 0 auto; }
  h1 { font-size: 16pt; text-align: center; margin-bottom: 4pt; }
  h2 { font-size: 13pt; margin-top: 18pt; margin-bottom: 6pt; border-bottom: 1px solid #ccc; padding-bottom: 3pt; }
  h3 { font-size: 12pt; margin-top: 14pt; }
  p { text-align: justify; margin: 6pt 0; }
  table { border-collapse: collapse; width: 100%; margin: 12pt 0; font-size: 11pt; }
  th, td { border: 1px solid #666; padding: 4pt 8pt; text-align: left; }
  th { background: #f0f0f0; font-weight: bold; }
  .references { margin-top: 8pt; }
  .ref-entry { text-indent: -0.5in; padding-left: 0.5in; font-size: 11pt; margin: 4pt 0; }
  code { font-family: "Courier New", monospace; font-size: 11pt; }
  pre { background: #f5f5f5; padding: 8pt; border: 1px solid #ddd; overflow-x: auto; font-size: 10pt; }
  .katex { font-size: 1em; }
</style></head><body>
${bodyHtml}
${chartImagesHtml}
${refsHtml}
</body>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>
<script>
  renderMathInElement(document.body, {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false},
      {left: "\\\\(", right: "\\\\)", display: false},
      {left: "\\\\[", right: "\\\\]", display: true}
    ]
  });
  setTimeout(() => window.print(), 300);
<\/script></html>`;

  const w = window.open('', '_blank');
  w.document.write(printDoc);
  w.document.close();
}

// --- Feedback ---
function appendFeedback(bubble, messageIdx) {
  const controls = document.createElement('div');
  controls.className = 'feedback-controls';

  ['up', 'down'].forEach(sentiment => {
    const btn = document.createElement('button');
    btn.className = 'feedback-btn';
    btn.dataset.sentiment = sentiment;
    btn.title = sentiment === 'up' ? 'Helpful' : 'Not helpful';
    btn.textContent = sentiment === 'up' ? '\u2713' : '\u2717';
    btn.addEventListener('click', () => submitFeedback(controls, sentiment, messageIdx, bubble));
    controls.appendChild(btn);
  });

  bubble.appendChild(controls);
}

async function submitFeedback(controls, sentiment, messageIdx, bubble) {
  const buttons = controls.querySelectorAll('.feedback-btn');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.sentiment === sentiment) b.classList.add('selected');
  });

  // Check if this bubble has chunk context for validation
  const queryText = bubble?.dataset?.queryText;
  const chunkIds = bubble?.dataset?.chunkIds ? JSON.parse(bubble.dataset.chunkIds) : null;
  const chunkScores = bubble?.dataset?.chunkScores ? JSON.parse(bubble.dataset.chunkScores) : null;
  const hasContext = sentiment === 'up' && queryText && chunkIds && chunkIds.length > 0;

  let password = null;
  if (hasContext) {
    password = prompt('Enter validation password to mark this as a verified citation:');
    if (!password) {
      // User cancelled — still send regular feedback without validation
      buttons.forEach(b => { b.disabled = false; b.classList.remove('selected'); });
      return;
    }
  }

  try {
    const payload = {
      conversation_id: conversationId,
      message_index: messageIdx,
      sentiment: sentiment,
    };
    if (hasContext && password) {
      payload.query_text = queryText;
      payload.chunk_ids = chunkIds;
      payload.scores = chunkScores;
      payload.password = password;
    }

    const res = await fetch('/api/v1/chat/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 403) {
        alert('Invalid validation password.');
        buttons.forEach(b => { b.disabled = false; b.classList.remove('selected'); });
        return;
      }
      throw new Error(err.detail || 'Feedback failed');
    }

    const data = await res.json();
    if (data.validated) {
      const badge = document.createElement('span');
      badge.className = 'validated-badge';
      badge.textContent = '\u2713 Validated';
      controls.appendChild(badge);
    }
  } catch (err) {
    console.error('Feedback submit failed:', err);
  }
}

function startNewChat() {
  conversationId = null;
  agentMessageIndex = 0;
  chatEl.innerHTML = '';
  if (welcomeEl) welcomeEl.style.display = '';
  metaEl.textContent = '';
  inputEl.focus();
}

async function resetValidations() {
  if (!confirm('Clear all validated citations? This is used for demo reset.')) return;
  try {
    const res = await fetch('/api/v1/chat/validations', { method: 'DELETE' });
    const data = await res.json();
    alert('Validations cleared: ' + (data.deleted || 0) + ' removed.');
  } catch (err) {
    console.error('Reset validations failed:', err);
    alert('Failed to reset validations.');
  }
}
