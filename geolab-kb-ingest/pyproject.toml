[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geolab-kb-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pgvector",
    "requests",
    "click",
    "rich",
    "tiktoken",
    "pdfplumber>=0.10.0",
    "fastapi>=0.110",
    "uvicorn[standard]",
    "anthropic>=0.40",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "mypy",
]

[project.scripts]
geolab-kb-ingest = "geolab_kb_ingest.cli:cli"
geolab-kb-agent = "geolab_kb_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
