[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geolab-kb-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pgvector",
    "voyageai",
    "click",
    "rich",
    "tiktoken",
    "pdfplumber>=0.10.0",
    "fastapi>=0.110",
    "uvicorn[standard]",
    "anthropic>=0.40",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
geolab-kb-ingest = "geolab_kb_ingest.cli:cli"
geolab-kb-agent = "geolab_kb_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
