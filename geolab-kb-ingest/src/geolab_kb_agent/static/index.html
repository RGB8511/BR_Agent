<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLab KB Agent</title>
<!-- Marked for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- KaTeX for LaTeX math -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --user-bg: #1d4ed8;
    --agent-bg: #1e293b;
    --success: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  .header h1 span { color: var(--accent); }

  /* Mode toggle */
  .mode-toggle {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }
  .mode-btn {
    padding: 5px 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: white;
  }
  .mode-btn:hover:not(.active) {
    color: var(--text);
  }

  /* Chat area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  .welcome h2 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  .welcome p {
    color: var(--text-muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .starters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .starter-btn {
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .starter-btn:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }

  /* Messages */
  .message {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 12px;
  }
  .message.user { justify-content: flex-end; }
  .message.agent { justify-content: flex-start; }

  .message-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.6;
    font-size: 14px;
  }
  .message.user .message-bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
  }
  .message.agent .message-bubble {
    background: var(--agent-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  /* Markdown content styles */
  .message-bubble h1, .message-bubble h2, .message-bubble h3, .message-bubble h4 {
    margin-top: 12px;
    margin-bottom: 6px;
  }
  .message-bubble h3 { font-size: 15px; }
  .message-bubble h4 { font-size: 14px; }
  .message-bubble p { margin-bottom: 8px; }
  .message-bubble ul, .message-bubble ol {
    margin-left: 20px;
    margin-bottom: 8px;
  }
  .message-bubble table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    width: 100%;
  }
  .message-bubble th, .message-bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .message-bubble th {
    background: var(--surface2);
    font-weight: 600;
  }
  .message-bubble code {
    background: var(--surface2);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .message-bubble pre {
    background: var(--bg);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .message-bubble pre code {
    background: none;
    padding: 0;
  }
  .message-bubble strong { color: #93c5fd; }

  /* Sources */
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .source-badge {
    padding: 3px 8px;
    background: var(--surface2);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-muted);
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .source-badge .src-id { color: var(--accent); }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }

  /* Input area */
  .input-area {
    padding: 16px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-wrapper {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrapper textarea {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 150px;
    line-height: 1.5;
  }
  .input-wrapper textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .input-wrapper textarea::placeholder {
    color: var(--text-muted);
  }
  .send-btn {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Meta info */
  .meta-info {
    max-width: 800px;
    margin: 0 auto;
    padding-top: 4px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* KaTeX overrides */
  .katex { font-size: 1em; }
  .katex-display { margin: 10px 0; overflow-x: auto; }
</style>
</head>
<body>

<div class="header">
  <h1><span>GeoLab</span> KB Agent</h1>
  <div class="mode-toggle">
    <button class="mode-btn" data-mode="concise">Concise</button>
    <button class="mode-btn active" data-mode="educational">Educational</button>
    <button class="mode-btn" data-mode="report">Report</button>
    <button class="mode-btn" data-mode="calculation">Calc</button>
    <button class="mode-btn" data-mode="review">Review</button>
    <button class="mode-btn" data-mode="field">Field</button>
  </div>
</div>

<div class="chat-container" id="chat">
  <div class="welcome" id="welcome">
    <h2>Geotechnical Knowledge Base</h2>
    <p>Ask questions about soil mechanics, rock mechanics, foundations, hydrology, concrete engineering, and more. Powered by 3,192 curated knowledge chunks from 117 packages.</p>
    <div class="starters">
      <button class="starter-btn" onclick="sendStarter(this)">What is the Mohr-Coulomb failure criterion?</button>
      <button class="starter-btn" onclick="sendStarter(this)">Show me the bearing capacity equation</button>
      <button class="starter-btn" onclick="sendStarter(this)">What are the ISRM rock strength classes?</button>
      <button class="starter-btn" onclick="sendStarter(this)">What topics are in the knowledge base?</button>
      <button class="starter-btn" onclick="sendStarter(this)">Explain Terzaghi's effective stress principle</button>
      <button class="starter-btn" onclick="sendStarter(this)">How is the compression index calculated?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="input" rows="1" placeholder="Ask a geotechnical question..." autofocus></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
  </div>
  <div class="meta-info" id="meta"></div>
</div>

<script>
const STREAM_API = '/api/v1/chat/stream';
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const metaEl = document.getElementById('meta');
const welcomeEl = document.getElementById('welcome');

let currentMode = 'educational';
let conversationId = null;
let isLoading = false;

// Configure marked
marked.setOptions({ breaks: true, gfm: true });

// Mode toggle
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
  });
});

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
});

// Enter to send, Shift+Enter for newline
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

function sendStarter(btn) {
  inputEl.value = btn.textContent;
  send();
}

function appendSources(bubble, sources) {
  if (!sources || sources.length === 0) return;
  const srcDiv = document.createElement('div');
  srcDiv.className = 'sources';
  const shown = sources.slice(0, 8);
  shown.forEach(src => {
    const badge = document.createElement('span');
    badge.className = 'source-badge';
    if (src.value) {
      badge.innerHTML = `${escapeHtml(src.value)}`;
      badge.title = src.record_id;
    } else {
      badge.innerHTML = `<span class="src-id">${escapeHtml(src.record_id || 'chunk')}</span>`;
    }
    srcDiv.appendChild(badge);
  });
  if (sources.length > 8) {
    const more = document.createElement('span');
    more.className = 'source-badge';
    more.textContent = `+${sources.length - 8} more`;
    srcDiv.appendChild(more);
  }
  bubble.appendChild(srcDiv);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderContent(bubble, text) {
  bubble.innerHTML = marked.parse(text);
  renderMathInElement(bubble, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false },
    ],
    throwOnError: false,
  });
}

async function send() {
  const message = inputEl.value.trim();
  if (!message || isLoading) return;

  // Hide welcome
  if (welcomeEl) welcomeEl.style.display = 'none';

  // Add user message
  addUserMessage(message);

  // Clear input
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Create agent bubble with typing indicator
  const { msgEl, bubble } = createAgentBubble();

  isLoading = true;
  sendBtn.disabled = true;
  metaEl.textContent = '';

  const startTime = Date.now();

  try {
    const res = await fetch(STREAM_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        mode: currentMode,
        conversation_id: conversationId,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let renderScheduled = false;

    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        renderContent(bubble, fullText);
        chatEl.scrollTop = chatEl.scrollHeight;
        renderScheduled = false;
      });
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // Parse SSE lines
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line in buffer

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);
        if (!jsonStr) continue;

        let event;
        try {
          event = JSON.parse(jsonStr);
        } catch {
          continue;
        }

        if (event.conversation_id) {
          conversationId = event.conversation_id;
        }

        if (event.text) {
          fullText += event.text;
          scheduleRender();
        }

        if (event.error) {
          fullText += `\n\n**Error:** ${event.error}`;
          renderContent(bubble, fullText);
        }

        if (event.done) {
          // Final render
          renderContent(bubble, fullText);
          appendSources(bubble, event.sources);
          chatEl.scrollTop = chatEl.scrollHeight;

          // Show meta
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          const parts = [`${elapsed}s`];
          if (event.tool_calls_made) parts.push(`${event.tool_calls_made} tool calls`);
          if (event.sources?.length) parts.push(`${event.sources.length} sources`);
          metaEl.textContent = parts.join(' \u00b7 ');
        }
      }
    }

    // If stream ended without a done event, do a final render
    if (fullText && !bubble.querySelector('.sources')) {
      renderContent(bubble, fullText);
    }

  } catch (err) {
    renderContent(bubble, `**Error:** ${err.message}`);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function addUserMessage(text) {
  const msgEl = document.createElement('div');
  msgEl.className = 'message user';
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = text;
  msgEl.appendChild(bubble);
  chatEl.appendChild(msgEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function createAgentBubble() {
  const msgEl = document.createElement('div');
  msgEl.className = 'message agent';
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgEl.appendChild(bubble);
  chatEl.appendChild(msgEl);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { msgEl, bubble };
}
</script>
</body>
</html>
